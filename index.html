<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ארץ ישראל שלי</title><link rel="stylesheet" href="style.css">
</head>
<body>
<header class="header"><span>פרויקט תיעוד</span><span>ארץ ישראל שלי</span></header>
<main>
<section class="intro"><p class="eyebrow">דימויים · זיכרון · משחק</p><h1>ארץ ישראל שלי</h1><div class="intro-line"></div><h2>דמויות מעץ</h2><p>דמויות משחק מעץ בהשראת דימויים ישראליים. לחצו על הדמויות המסומנות כדי לגלות את תהליך העבודה.</p></section>
<section class="figures" aria-label="דמויות העץ"><div class="caption"><span>להכיר מקרוב</span><span>לחצו על הדמויות המסומנות</span></div><div class="image-wrap"><img src="assets/figures-source.png" alt="קבוצת דמויות משחק מעץ על שולחן">
<button class="hotspot runner" type="button" data-image="runner-process.jpg" data-name="הילד הרץ" aria-label="תהליך העבודה על הילד הרץ"><span>+</span></button>
<button class="hotspot tank" type="button" data-image="process-1.jpg" data-name="הטנק" aria-label="תהליך העבודה על הטנק"><span>+</span></button>
<button class="hotspot dove" type="button" data-image="process-2.jpg" data-name="יונת השלום" aria-label="תהליך העבודה על יונת השלום"><span>+</span></button>
<button class="hotspot girl-green" type="button" data-image="process-3.jpg" data-name="הדמות בחולצה כחולה ומכנסיים ירוקים" aria-label="תהליך העבודה על הדמות בחולצה כחולה ומכנסיים ירוקים"><span>+</span></button>
<button class="hotspot polka" type="button" data-image="process-4.jpg" data-name="הילדה בשמלה המנוקדת" aria-label="תהליך העבודה על הילדה בשמלה המנוקדת"><span>+</span></button>
<button class="hotspot overalls" type="button" data-image="process-5.jpg" data-name="הדמות בסרבל הכחול" aria-label="תהליך העבודה על הדמות בסרבל הכחול"><span>+</span></button>
</div><p class="access-hint">אפשר לבחור דמות גם באמצעות המקלדת.</p></section>
</main>
<dialog aria-label="תהליך העבודה"><button class="close" type="button" aria-label="סגירה">×</button><div class="modal-body"><img alt=""></div></dialog>
<script src="script.js"></script></body></html>
